<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thread — Major Roleplay</title><link rel="icon" type="image/webp" href="https://media.discordapp.net/attachments/1546562768998768704/1546840847092416512/ffebe2cb-bc78-494f-b7a8-e1a36bbfd758.png?ex=6aa13f4c&is=6a9fedcc&hm=efb52433c7f1c4ae265aee1aefe67c7060ff74ff060862d3f6ac161f5ce19034&=&format=webp&quality=lossless&width=1024&height=1024"><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script></head><body class="forum-site"><header class="forum-header"><div class="forum-header-inner"><a class="forum-logo" href="index.html"><span>MAJOR</span> ROLEPLAY</a><nav class="forum-nav"><a href="index.html">HOME</a><a class="active" href="forum.html">FORUMS</a><a href="servers.html">SERVERS</a></nav><div class="forum-account" data-auth-state><a href="auth.html">Log in</a><a class="forum-signup" href="register.html">Sign up</a></div></div></header><main class="forum-wrap"><div class="forum-hero"><div><div class="eyebrow">Forums / Thread</div><h1 id="thread-title">Loading…</h1><p><span class="badge green" id="thread-status">Open</span> <span id="thread-category"></span></p></div><div class="hero-actions" id="thread-actions"><a class="ghost" id="back-link" href="forum.html">Back</a></div></div><div class="breadcrumbs"><a href="forum.html">Forums</a><span>›</span><a id="category-link" href="forum.html">Category</a><span>›</span><strong>Thread</strong></div><section class="thread-view" id="posts"></section><section class="auth-card" id="reply-card" style="max-width:900px;margin:24px auto;display:none"><form id="reply-form"><label>Reply<textarea id="reply-content" rows="7" maxlength="10000" required placeholder="Write your reply..."></textarea></label><button class="primary-btn auth-submit" type="submit">Post reply</button></form><div id="reply-message" class="auth-message" aria-live="polite"></div></section><div id="page-message" class="auth-message" aria-live="polite"></div></main><script src="assets/js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{
 const id=Number(new URLSearchParams(location.search).get('id')),postsEl=document.querySelector('#posts'),pageMsg=document.querySelector('#page-message'),replyCard=document.querySelector('#reply-card'),actions=document.querySelector('#thread-actions');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fail=text=>{pageMsg.textContent=text||'Unable to load thread.';pageMsg.className='auth-message error'};
 const renderPosts=(ps,user,staff)=>{postsEl.innerHTML=(ps||[]).map((p,i)=>{const name=p.profiles?.display_name||p.profiles?.username||'Member',initial=(name[0]||'M').toUpperCase(),joined=p.profiles?.created_at?new Date(p.profiles.created_at).toLocaleDateString():'';const own=user&&p.author_id===user.id;return '<article class="post"><aside class="post-user"><div class="avatar">'+esc(initial)+'</div><div><strong>'+esc(name)+'</strong><small>'+esc(p.profiles?.role||'Member')+(joined?'<br>Joined '+esc(joined):'')+'</small></div></aside><div class="post-body"><div class="post-meta">#'+(i+1)+' · '+new Date(p.created_at).toLocaleString()+(p.edited_at?' · edited':'')+'</div><div class="post-content" id="post-content-'+p.id+'">'+esc(p.content).replace(/\n/g,'<br>')+'</div><div class="post-actions">'+(own?'<button class="admin-btn" data-edit="'+p.id+'">Edit</button><button class="admin-btn danger" data-delete="'+p.id+'">Delete</button>':'')+'</div></div></article>'}).join('')||'<div class="auth-message">No posts found.</div>';};
 try{
  if(!id)throw new Error('This thread could not be found.');const sb=majorClient();
  const tr=await sb.from('forum_threads').select('id,title,status,is_locked,is_pinned,is_sticky,views,created_at,updated_at,category_id,forum_categories(id,name,parent_id),profiles(username,display_name,role,created_at)').eq('id',id).maybeSingle();
  if(tr.error)throw tr.error;if(!tr.data)throw new Error('This thread could not be found.');const t=tr.data,cat=t.forum_categories,locked=t.is_locked||t.status==='locked';
  document.title=t.title+' — Major Roleplay';document.querySelector('#thread-title').textContent=t.title;document.querySelector('#thread-status').textContent=locked?'Locked':t.status==='pending'?'Pending review':'Open';document.querySelector('#thread-status').className='badge '+(locked?'red':'green');document.querySelector('#thread-category').textContent='Posted in '+(cat?.name||'Major Roleplay');document.querySelector('#category-link').textContent=cat?.name||'Category';document.querySelector('#category-link').href=cat?'forum-category.html?category_id='+cat.id:'forum.html';document.querySelector('#back-link').href=cat?'forum-category.html?category_id='+cat.id:'forum.html';
  const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;let staff=false;if(user){const pr=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();staff=!!pr.data&&['admin','moderator'].includes(pr.data.role)}
  if(staff){actions.insertAdjacentHTML('afterbegin','<button class="admin-btn" id="pin-btn">'+(t.is_pinned||t.is_sticky?'Unpin':'Pin')+'</button><button class="admin-btn danger" id="lock-btn">'+(locked?'Unlock':'Lock')+'</button>');document.querySelector('#pin-btn').onclick=async()=>{const r=await sb.rpc('moderate_thread',{p_thread_id:id,p_locked:locked,p_pinned:!(t.is_pinned||t.is_sticky)});if(r.error)alert(r.error.message);else location.reload()};document.querySelector('#lock-btn').onclick=async()=>{const next=!locked;if(!confirm(next?'Lock this thread?':'Unlock this thread?'))return;const r=await sb.rpc('moderate_thread',{p_thread_id:id,p_locked:next,p_pinned:!!(t.is_pinned||t.is_sticky)});if(r.error)alert(r.error.message);else location.reload()}}
  const {data:ps,error:pe}=await sb.from('forum_posts').select('id,content,created_at,updated_at,edited_at,deleted_at,author_id,profiles(username,display_name,role,created_at)').eq('thread_id',id).is('deleted_at',null).order('created_at',{ascending:true});if(pe)throw pe;renderPosts(ps,user,staff);
  const viewUpdate=await sb.rpc('increment_forum_thread_views',{p_thread_id:id});if(viewUpdate.error)console.warn('Could not update view count:',viewUpdate.error.message);
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const p=ps.find(x=>String(x.id)===b.dataset.edit);if(!p)return;const content=prompt('Edit your post:',p.content);if(content===null)return;const r=await sb.rpc('forum_edit_post',{p_post_id:p.id,p_content:content});if(r.error)alert(r.error.message);else location.reload()});
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this post?'))return;const r=await sb.rpc('forum_delete_post',{p_post_id:Number(b.dataset.delete)});if(r.error)alert(r.error.message);else location.reload()});
  if(locked){replyCard.innerHTML='<div class="auth-message">This thread is locked and cannot receive replies.</div>';return}if(!user)return;replyCard.style.display='block';document.querySelector('#reply-form').addEventListener('submit',async e=>{e.preventDefault();const textarea=document.querySelector('#reply-content'),m=document.querySelector('#reply-message'),b=e.currentTarget.querySelector('button'),content=textarea.value.trim();if(!content){m.textContent='Please enter a reply.';m.className='auth-message error';return}b.disabled=true;b.textContent='Posting…';m.textContent='Posting…';m.className='auth-message';const r=await sb.from('forum_posts').insert({thread_id:id,author_id:user.id,content});if(r.error){m.textContent=r.error.message||'Unable to post your reply.';m.className='auth-message error';b.disabled=false;b.textContent='Post reply';return}location.reload()});
 }catch(e){fail(e.message)}
});
</script></body></html>
