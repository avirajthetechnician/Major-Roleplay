reply</button></form><div id="reply-message" class="auth-message"></div></section><div id="page-message" class="auth-message"></div></main><script src="assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=Number(new URLSearchParams(location.search).get('id')),postsEl=document.querySelector('#posts'),pageMsg=document.querySelector('#page-message'),replyCard=document.querySelector('#reply-card'),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));try{if(!id)throw new Error('This thread could not be found.');const sb=majorClient();const tr=await sb.from('forum_threads').select('id,title,status,views,created_at,updated_at,category_id,forum_categories(id,name,parent_id),profiles(username,display_name)').eq('id',id).maybeSingle();if(tr.error)throw tr.error;if(!tr.data)throw new Error('This thread could not be found.');const t=tr.data,cat=t.forum_categories,author=t.profiles?.display_name||t.profiles?.username||'Member';document.title=t.title+' — Major Roleplay';document.querySelector('#thread-title').textContent=t.title;document.querySelector('#thread-status').textContent=t.status==='locked'?'Locked':t.status==='pending'?'Pending review':'Open';document.querySelector('#thread-status').className='badge '+(t.status==='locked'?'':t.status==='pending'?'':'green');document.querySelector('#thread-category').textContent='Posted in '+(cat?.name||'Major Roleplay');document.querySelector('#category-link').textContent=cat?.name||'Category';document.querySelector('#category-link').href='forum-category.html?id='+t.category_id;document.querySelector('#back-link').href='forum-category.html?id='+t.category_id;const ps=await sb.from('forum_posts').select('id,content,created_at,updated_at,edited_at,deleted_at,author_id,profiles(username,display_name,role,created_at)').eq('thread_id',id).is('deleted_at',null).order('created_at',{ascending:true});if(ps.error)throw ps.error;postsEl.innerHTML=(ps.data||[]).map((p,i)=>{const name=p.profiles?.display_name||p.profiles?.username||'Member',initial=(name[0]||'M').toUpperCase(),joined=p.profiles?.created_at?new Date(p.profiles.created_at).toLocaleDateString():'';return '<article class="post"><aside class="post-user"><div class="avatar">'+esc(initial)+'</div><div><strong>'+esc(name)+'</strong><small>'+esc(p.profiles?.role||'Member')+(joined?'<br>Joined '+esc(joined):'')+'</small></div></aside><div class="post-body"><div class="post-meta">#'+(i+1)+' · '+new Date(p.created_at).toLocaleString()+(p.edited_at?' · edited':'')+'</div><div class="post-content">'+esc(p.content).replace(/\n/g,'<br>')+'</div></div></article>'}).join('')||'<div class="auth-message">No posts found.</div>';const {data:{user}}=await sb.auth.getUser();if(user&&t.status!=='locked'){replyCard.style.display='block';document.querySelector('#reply-form').addEventListener('submit',async e=>{e.preventDefault();const content=document.querySelector('#reply-content').value.trim(),m=document.querySelector('#reply-message'),b=e.currentTarget.querySelector('button');if(!content)return;b.disabled=true;m.textContent='Posting…';const r=await sb.from('forum_posts').insert({thread_id:id,author_id:user.id,content});if(r.error){m.textContent=r.error.message;m.className='auth-message error';b.disabled=false;return}location.reload()})}}catch(e){pageMsg.textContent=e.message||'Unable to load thread.';pageMsg.className='auth-message error'}});</script></body></html>
