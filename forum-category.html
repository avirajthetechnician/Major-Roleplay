<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category — Major Roleplay</title><link rel="icon" type="image/webp" href="https://media.discordapp.net/attachments/1546562768998768704/1546840847092416512/ffebe2cb-bc78-494f-b7a8-e1a36bbfd758.png?ex=6aa13f4c&is=6a9fedcc&hm=efb52433c7f1c4ae265aee1aefe67c7060ff74ff060862d3f6ac161f5ce19034&=&format=webp&quality=lossless&width=1024&height=1024"><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script></head><body class="forum-site"><header class="forum-header"><div class="forum-header-inner"><a class="forum-logo" href="index.html"><span>MAJOR</span> ROLEPLAY</a><nav class="forum-nav"><a href="index.html">HOME</a><a class="active" href="forum.html">FORUMS</a><a href="servers.html">SERVERS</a></nav><div class="forum-account" data-auth-state><a href="auth.html">Log in</a><a class="forum-signup" href="register.html">Sign up</a></div></div></header><main class="forum-wrap"><div class="forum-hero"><div><div class="eyebrow">Forums / Category</div><h1 id="category-title">Loading…</h1><p id="category-description">Loading forum section.</p></div><div class="hero-actions"><a class="ghost" href="forum.html">Back to forums</a><a class="primary-btn" id="post-thread-link" href="#">Post thread</a></div></div><div class="breadcrumbs"><a href="forum.html">Forums</a><span>›</span><strong id="crumb-title">Category</strong></div><div id="subforum-box"></div><div class="forum-toolbar"><select id="status-filter" class="filter"><option value="all">Show only: All threads</option><option value="open">Open</option><option value="locked">Locked</option><option value="pending">Pending review</option><option value="review">On consideration</option></select><input id="thread-search" class="search" placeholder="Search this category…"></div><div class="thread-head"><span>Title</span><span>Replies</span><span>Views</span><span>Latest</span></div><div id="thread-list" class="thread-list"><div class="thread-row"><div class="thread-title">Loading threads…</div><div class="stat">—</div><div class="stat">—</div><div class="latest">—</div></div></div><div class="pagination"><span class="page active">1</span></div></main><script src="assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const p=new URLSearchParams(location.search);const categoryId=Number(p.get('category_id'));const sectionId=Number(p.get('section_id'));const activeId=sectionId||categoryId;const title=document.querySelector('#category-title'),desc=document.querySelector('#category-description'),crumb=document.querySelector('#crumb-title'),list=document.querySelector('#thread-list'),post=document.querySelector('#post-thread-link'),sub=document.querySelector('#subforum-box');let rows=[];try{const sb=majorClient();if(!activeId)throw new Error('This forum section does not have a valid ID.');const {data:cat,error:ce}=await sb.from('forum_categories').select('id,name,description,parent_id').eq('id',activeId).maybeSingle();if(ce)throw ce;if(!cat)throw new Error('Forum section not found.');title.textContent=cat.name;crumb.textContent=cat.name;desc.textContent=cat.description||'Discuss Major Roleplay here.';document.title=cat.name+' — Major Roleplay';post.href='post-thread.html?category_id='+cat.id;if(cat.parent_id)document.querySelector('.breadcrumbs').innerHTML='<a href="forum.html">Forums</a><span>›</span><a href="forum-category.html?category_id='+cat.parent_id+'">Section</a><span>›</span><strong>'+escapeHtml(cat.name)+'</strong>';const {data:children,error:cherr}=await sb.from('forum_categories').select('id,name,description,position').eq('parent_id',cat.id).order('position').order('id');if(cherr)throw cherr;if(children?.length){sub.innerHTML='<section class="xf-block"><div class="block-title">Sections</div>'+children.map(c=>'<a class="xf-row" href="forum-category.html?category_id='+c.id+'"><div class="xf-icon red-icon">›</div><div class="xf-row-main"><strong>'+escapeHtml(c.name)+'</strong><small>'+escapeHtml(c.description||'Forum section')+'</small></div><div class="xf-stats"><b>—</b><span>Threads</span><b>—</b><span>Messages</span></div><div class="xf-latest">Open section</div></a>').join('')+'</section>'}else sub.innerHTML='';await load();document.querySelector('#status-filter').onchange=load;document.querySelector('#thread-search').oninput=load;async function load(){const status=document.querySelector('#status-filter').value;const search=document.querySelector('#thread-search').value.trim();let q=sb.from('forum_threads').select('id,title,status,is_sticky,is_pinned,is_locked,views,created_at,updated_at,author_id,profiles(username,display_name)').eq('category_id',cat.id).order('is_sticky',{ascending:false}).order('is_pinned',{ascending:false}).order('updated_at',{ascending:false});if(status!=='all')q=q.eq('status',status);const {data,error}=await q;if(error)throw error;rows=data||[];if(search)rows=rows.filter(t=>t.title.toLowerCase().includes(search.toLowerCase()));if(!rows.length){list.innerHTML='<div class="thread-row"><div class="thread-title">No threads yet<small>Be the first to start a discussion in this section.</small></div><div class="stat">0</div><div class="stat">0</div><div class="latest">—</div></div>';return}list.innerHTML=rows.map(t=>{const name=t.profiles?.display_name||t.profiles?.username||'Member';const replies='—';const badge=t.is_pinned||t.is_sticky?'<span class="badge red">Pinned</span> ':t.is_locked||t.status==='locked'?'<span class="badge">Locked</span> ':'';return '<a class="thread-row" href="forum-thread.html?id='+t.id+'"><div class="thread-title">'+badge+escapeHtml(t.title)+'<small>by '+escapeHtml(name)+' · '+new Date(t.updated_at||t.created_at).toLocaleString()+'</small></div><div class="stat">'+replies+'</div><div class="stat">'+(t.views||0)+'</div><div class="latest">'+new Date(t.updated_at||t.created_at).toLocaleDateString()+'</div></a>'}).join('')}}catch(e){list.innerHTML='<div class="thread-row"><div class="thread-title">Unable to load this forum<small>'+escapeHtml(e.message)+'</small></div></div>'}});function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
