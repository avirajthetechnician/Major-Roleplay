 id="thread-search" placeholder="Search this category…"></div><div class="thread-head" id="thread-head" style="display:none"><span>Title</span><span>Replies</span><span>Views</span><span>Latest</span></div><div class="thread-list" id="thread-list"></div><div class="pagination" id="pagination"></div><div id="category-message" class="auth-message"></div></main><script src="assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const p=new URLSearchParams(location.search),id=Number(p.get('id')),key=p.get('category');const $=s=>document.querySelector(s);const msg=$('#category-message');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));try{const sb=majorClient();let cat=null;if(id){const r=await sb.from('forum_categories').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;cat=r.data}else{const names={faq:'Frequently Asked Questions',complaints:'Complaints',applications:'Applications',rules:'Server and Forum Rules',services:'Community Services',technical:'Technical Section','server-rules':'Server Rules'};const r=await sb.from('forum_categories').select('*').eq('name',names[key]||key||'').maybeSingle();if(r.error)throw r.error;cat=r.data}if(!cat){msg.textContent='This forum section could not be found.';msg.className='auth-message error';return}$('#category-title').textContent=cat.name;$('#crumb-title').textContent=cat.name;$('#category-description').textContent=cat.description||'';document.title=cat.name+' — Major Roleplay';$('#back-link').href=cat.parent_id?'forum-category.html?id='+cat.parent_id:'forum.html';const children=await sb.from('forum_categories').select('id,name,description,position').eq('parent_id',cat.id).order('position').order('id');if(children.error)throw children.error;if(children.data?.length){$('#subforums').innerHTML='<section class="xf-block"><div class="block-title">Sections</div>'+children.data.map(c=>'<a class="xf-row" href="forum-category.html?id='+c.id+'"><div class="xf-icon red-icon">›</div><div class="xf-row-main"><strong>'+esc(c.name)+'</strong><small>'+esc(c.description||'')+'</small></div></a>').join('')+'</section>';return}$('#post-thread-link').style.display='inline-flex';$('#post-thread-link').href='post-thread.html?id='+cat.id;$('#thread-tools').style.display='flex';$('#thread-head').style.display='grid';async function load(){let q=sb.from('forum_threads').select('id,title,status,is_sticky,is_pinned,views,created_at,updated_at,author_id,profiles(username,display_name),forum_posts(count)').eq('category_id',cat.id).order('is_sticky',{ascending:false}).order('is_pinned',{ascending:false}).order('updated_at',{ascending:false});const f=$('#thread-filter').value;if(f!=='all')q=q.eq('status',f);const search=$('#thread-search').value.trim();if(search)q=q.ilike('title','%'+search+'%');const r=await q;if(r.error)throw r.error;const rows=r.data||[];$('#thread-list').innerHTML=rows.length?rows.map(t=>{const author=t.profiles?.display_name||t.profiles?.username||'Member';const replies=Math.max(0,(t.forum_posts?.[0]?.count||0)-1);const badge=t.is_sticky||t.is_pinned?'<span class="badge red">Pinned</span> ':t.status==='locked'?'<span class="badge">Locked</span> ':'';return '<a class="thread-row" href="forum-thread.html?id='+t.id+'"><div class="thread-title">'+badge+esc(t.title)+'<small>by '+esc(author)+'</small></div><div class="stat">'+replies+'</div><div class="stat">'+(t.views||0)+'</div><div class="latest">'+new Date(t.updated_at||t.created_at).toLocaleString()+'</div></a>'}).join(''):'<div class="thread-row"><div class="thread-title">No threads yet<small>Be the first to start a discussion.</small></div><div class="stat">0</div><div class="stat">0</div><div class="latest">—</div></div>'}$('#thread-search').addEventListener('input',load);$('#thread-filter').addEventListener('change',load);await load()}catch(e){msg.textContent=e.message||'Unable to load this forum.';msg.className='auth-message error'}});</script></body></html>
