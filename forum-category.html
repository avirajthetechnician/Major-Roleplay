<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category — Major Roleplay</title><link rel="icon" type="image/webp" href="https://media.discordapp.net/attachments/1546562768998768704/1546840847092416512/ffebe2cb-bc78-494f-b7a8-e1a36bbfd758.png?ex=6aa13f4c&is=6a9fedcc&hm=efb52433c7f1c4ae265aee1aefe67c7060ff74ff060862d3f6ac161f5ce19034&=&format=webp&quality=lossless&width=1024&height=1024"><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script></head><body class="forum-site"><header class="forum-header"><div class="forum-header-inner"><a class="forum-logo" href="index.html"><span>MAJOR</span> ROLEPLAY</a><nav class="forum-nav"><a href="index.html">HOME</a><a class="active" href="forum.html">FORUMS</a><a href="servers.html">SERVERS</a></nav><div class="forum-account" data-auth-state><a href="auth.html">Log in</a><a class="forum-signup" href="register.html">Sign up</a></div></div></header><main class="forum-wrap"><div class="forum-hero"><div><div class="eyebrow">Forums / Category</div><h1 id="category-title">Loading…</h1><p id="category-description">Loading forum section.</p></div><div class="hero-actions"><a class="ghost" href="forum.html">Back to forums</a><a class="primary-btn" id="post-thread-link" href="#">Post thread</a></div></div><div class="breadcrumbs"><a href="forum.html">Forums</a><span>›</span><strong id="crumb-title">Category</strong></div><div id="subforum-box"></div><div class="forum-toolbar"><select id="status-filter" class="filter"><option value="all">Show only: All threads</option><option value="open">Open</option><option value="locked">Locked</option><option value="pending">Pending review</option><option value="review">On consideration</option></select><input id="thread-search" class="search" placeholder="Search this category…"></div><div class="thread-head"><span>Title</span><span>Replies</span><span>Views</span><span>Latest</span></div><div id="thread-list" class="thread-list"><div class="thread-row"><div class="thread-title">Loading threads…</div><div class="stat">—</div><div class="stat">—</div><div class="latest">—</div></div></div><div class="pagination"><span class="page active">1</span></div></main><script src="assets/js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{
 const p=new URLSearchParams(location.search),activeId=Number(p.get('category_id')||p.get('section_id')||p.get('id'));
 const title=document.querySelector('#category-title'),desc=document.querySelector('#category-description'),crumb=document.querySelector('#crumb-title'),list=document.querySelector('#thread-list'),post=document.querySelector('#post-thread-link'),sub=document.querySelector('#subforum-box');let sb,cat,rows=[];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const categoryUrl=id=>'forum-category?id='+encodeURIComponent(id);
 const threadUrl=id=>'forum-thread?id='+encodeURIComponent(id);
 const postUrl=id=>'post-thread?category_id='+encodeURIComponent(id);
 const setPost=(enabled,href,text)=>{post.href=href||'#';post.textContent=text||'Post thread';post.style.pointerEvents=enabled?'auto':'none';post.style.opacity=enabled?'1':'.55';post.setAttribute('aria-disabled',enabled?'false':'true')};
 try{
  sb=majorClient();if(!activeId)throw new Error('This forum section does not have a valid ID.');
  const {data,error}=await sb.from('forum_categories').select('id,name,description,parent_id').eq('id',activeId).maybeSingle();if(error)throw error;if(!data)throw new Error('Forum section not found.');cat=data;
  title.textContent=cat.name;crumb.textContent=cat.name;desc.textContent=cat.description||'Discuss Major Roleplay here.';document.title=cat.name+' — Major Roleplay';
  document.querySelector('.breadcrumbs').innerHTML=cat.parent_id?'<a href="forum.html">Forums</a><span>›</span><a href="'+categoryUrl(cat.parent_id)+'">Section</a><span>›</span><strong>'+esc(cat.name)+'</strong>':'<a href="forum.html">Forums</a><span>›</span><strong>'+esc(cat.name)+'</strong>';
  const {data:children,error:cherr}=await sb.from('forum_categories').select('id,name,description,position').eq('parent_id',cat.id).order('position').order('id');if(cherr)throw cherr;
  if(children?.length){setPost(false,'#','Choose a subsection');sub.innerHTML='<section class="xf-block"><div class="block-title">Sections</div>'+children.map(c=>'<a class="xf-row" href="'+categoryUrl(c.id)+'"><div class="xf-icon red-icon">›</div><div class="xf-row-main"><strong>'+esc(c.name)+'</strong><small>'+esc(c.description||'Forum section')+'</small></div><div class="xf-stats"><b>—</b><span>Threads</span><b>—</b><span>Messages</span></div><div class="xf-latest">Open section</div></a>').join('')+'</section>'}
  else{setPost(true,postUrl(cat.id),'Post thread');sub.innerHTML=''}
  async function load(){
   const status=document.querySelector('#status-filter').value,search=document.querySelector('#thread-search').value.trim();
   let q=sb.from('forum_threads').select('id,title,status,is_sticky,is_pinned,is_locked,views,created_at,updated_at,author_id,profiles(username,display_name)').eq('category_id',cat.id).order('is_sticky',{ascending:false}).order('is_pinned',{ascending:false}).order('updated_at',{ascending:false});
   if(status!=='all')q=q.eq('status',status);const {data,error}=await q;if(error)throw error;rows=data||[];if(search)rows=rows.filter(t=>String(t.title||'').toLowerCase().includes(search.toLowerCase()));
   if(!rows.length){list.innerHTML='<div class="thread-row"><div class="thread-title">No threads yet<small>Be the first to start a discussion in this section.</small></div><div class="stat">0</div><div class="stat">0</div><div class="latest">—</div></div>';return}
   const ids=rows.map(t=>t.id);let replyCounts={};if(ids.length){const rp=await sb.from('forum_posts').select('thread_id').in('thread_id',ids);if(!rp.error)(rp.data||[]).forEach(x=>replyCounts[x.thread_id]=(replyCounts[x.thread_id]||0)+1)}
   list.innerHTML=rows.map(t=>{const name=t.profiles?.display_name||t.profiles?.username||'Member',replies=Math.max(0,(replyCounts[t.id]||0)-1),badge=t.is_pinned||t.is_sticky?'<span class="badge red">Pinned</span> ':t.is_locked||t.status==='locked'?'<span class="badge">Locked</span> ':'';return '<a class="thread-row" href="'+threadUrl(t.id)+'"><div class="thread-title">'+badge+esc(t.title)+'<small>by '+esc(name)+' · '+new Date(t.updated_at||t.created_at).toLocaleString()+'</small></div><div class="stat">'+replies+'</div><div class="stat">'+(t.views||0)+'</div><div class="latest">'+new Date(t.updated_at||t.created_at).toLocaleDateString()+'</div></a>'}).join('')
  }
  await load();document.querySelector('#status-filter').onchange=load;document.querySelector('#thread-search').oninput=load;
 }catch(e){setPost(false,'#','Post thread');list.innerHTML='<div class="thread-row"><div class="thread-title">Unable to load this forum<small>'+esc(e.message)+'</small></div></div>'}
});
</script></body></html>
