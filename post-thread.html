<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a thread — Major Roleplay</title><link rel="icon" type="image/webp" href="https://media.discordapp.net/attachments/1546562768998768704/1546840847092416512/ffebe2cb-bc78-494f-b7a8-e1a36bbfd758.png?ex=6aa13f4c&is=6a9fedcc&hm=efb52433c7f1c4ae265aee1aefe67c7060ff74ff060862d3f6ac161f5ce19034&=&format=webp&quality=lossless&width=1024&height=1024"><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script></head><body class="forum-site"><header class="forum-header"><div class="forum-header-inner"><a class="forum-logo" href="index.html"><span>MAJOR</span> ROLEPLAY</a><nav class="forum-nav"><a href="index.html">HOME</a><a class="active" href="forum.html">FORUMS</a><a href="#">WHAT'S NEW</a><a href="#">MEMBERS</a></nav><div class="forum-account" data-auth-state><a href="auth.html">Log in</a><a class="forum-signup" href="register.html">Sign up</a></div></div></header><main class="forum-wrap"><div class="forum-hero"><div><div class="eyebrow">Forums / New thread</div><h1>Post a thread</h1><p>Create a new discussion for the selected section.</p></div><div class="hero-actions"><a class="ghost" id="back-link" href="forum.html">Back</a></div></div><section class="auth-card" style="max-width:900px;margin:24px auto"><form id="thread-form"><label>Title<input id="thread-title" maxlength="160" required placeholder="Thread title"></label><label>Message<textarea id="thread-content" rows="12" maxlength="10000" required placeholder="Write your message..."></textarea></label><button class="primary-btn auth-submit" type="submit">Post thread</button></form><div id="thread-message" class="auth-message"></div></section></main><script src="assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const params=new URLSearchParams(location.search);const category=params.get('category');const back=document.querySelector('#back-link');back.href='forum-category.html?category='+encodeURIComponent(category||'');const form=document.querySelector('#thread-form');const msg=document.querySelector('#thread-message');try{const sb=majorClient();const {data:{user}}=await sb.auth.getUser();if(!user){location.href='auth.html?next='+encodeURIComponent('post-thread.html?category='+(category||''));return}const names={faq:'Frequently Asked Questions',complaints:'Complaints',applications:'Applications',rules:'Server and Forum Rules',services:'Community Services',technical:'Technical Section','server-rules':'Server Rules'};const categoryName=names[category]||category||'';const {data:cat,error:catError}=await sb.from('forum_categories').select('id,name').eq('name',categoryName).maybeSingle();if(catError)throw catError;if(!cat){msg.textContent='This forum section could not be found.';msg.className='auth-message error';form.querySelector('button').disabled=true;return}form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Posting…';msg.className='auth-message';const title=document.querySelector('#thread-title').value.trim();const content=document.querySelector('#thread-content').value.trim();if(!title||!content)return;const {data:thread,error}=await sb.from('forum_threads').insert({category_id:cat.id,author_id:user.id,title,status:'open'}).select('id').single();if(error){msg.textContent=error.message;msg.className='auth-message error';return}const {error:postError}=await sb.from('forum_posts').insert({thread_id:thread.id,author_id:user.id,content});if(postError){await sb.from('forum_threads').delete().eq('id',thread.id);msg.textContent=postError.message;msg.className='auth-message error';return}location.href='forum-thread.html?id='+thread.id});}catch(e){msg.textContent=e.message;msg.className='auth-message error'}});</script></body></html>
