<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a thread — Major Roleplay</title><link rel="icon" type="image/webp" href="https://media.discordapp.net/attachments/1546562768998768704/1546840847092416512/ffebe2cb-bc78-494f-b7a8-e1a36bbfd758.png?ex=6aa13f4c&is=6a9fedcc&hm=efb52433c7f1c4ae265aee1aefe67c7060ff74ff060862d3f6ac161f5ce19034&=&format=webp&quality=lossless&width=1024&height=1024"><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script></head><body class="forum-site"><header class="forum-header"><div class="forum-header-inner"><a class="forum-logo" href="index.html"><span>MAJOR</span> ROLEPLAY</a><nav class="forum-nav"><a href="index.html">HOME</a><a class="active" href="forum.html">FORUMS</a><a href="servers.html">SERVERS</a></nav><div class="forum-account" data-auth-state><a href="auth.html">Log in</a><a class="forum-signup" href="register.html">Sign up</a></div></div></header><main class="forum-wrap"><div class="forum-hero"><div><div class="eyebrow">Forums / New thread</div><h1>Post a thread</h1><p id="category-label">Create a new discussion.</p></div><div class="hero-actions"><a class="ghost" id="back-link" href="forum.html">Back</a></div></div><section class="auth-card" style="max-width:900px;margin:24px auto"><form id="thread-form" novalidate><label>Title<input id="thread-title" maxlength="160" required placeholder="Thread title" autocomplete="off"></label><label>Message<textarea id="thread-content" rows="12" maxlength="10000" required placeholder="Write your message..."></textarea></label><button id="post-button" class="primary-btn auth-submit" type="submit">Post thread</button></form><div id="thread-message" class="auth-message" aria-live="polite"></div></section></main><script src="assets/js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{
 const p=new URLSearchParams(location.search),categoryId=Number(p.get('category_id')),back=document.querySelector('#back-link'),form=document.querySelector('#thread-form'),msg=document.querySelector('#thread-message'),button=document.querySelector('#post-button'),label=document.querySelector('#category-label');
 const setMsg=(text,type='')=>{msg.textContent=text;msg.className='auth-message'+(type?' '+type:'')};
 try{
  const sb=majorClient();
  const {data:{user},error:ue}=await sb.auth.getUser();
  if(ue)throw ue;
  if(!user){location.href='auth.html?next='+encodeURIComponent(location.pathname+location.search);return}
  if(!categoryId){button.disabled=true;setMsg('A forum subsection must be selected.','error');return}
  const {data:cat,error:ce}=await sb.from('forum_categories').select('id,name,parent_id').eq('id',categoryId).maybeSingle();
  if(ce)throw ce;
  if(!cat){button.disabled=true;setMsg('This forum section could not be found.','error');return}
  const {count:childCount,error:childError}=await sb.from('forum_categories').select('id',{count:'exact',head:true}).eq('parent_id',cat.id);
  if(childError)throw childError;
  if((childCount||0)>0){button.disabled=true;setMsg('This is a section, not a posting area. Choose one of its subsections first.','error');back.href='forum-category.html?category_id='+cat.id;return}
  label.textContent='Posting in '+cat.name;
  back.href=cat.parent_id?'forum-category.html?category_id='+cat.parent_id+'&section_id='+cat.id:'forum-category.html?category_id='+cat.id;
  form.addEventListener('submit',async e=>{
   e.preventDefault();
   if(button.disabled)return;
   const title=document.querySelector('#thread-title').value.trim(),content=document.querySelector('#thread-content').value.trim();
   if(!title||!content){setMsg('Please enter both a title and a message.','error');return}
   if(title.length>160||content.length>10000){setMsg('Your title or message is too long.','error');return}
   button.disabled=true;button.textContent='Posting…';setMsg('Posting…');
   const {data,error}=await sb.rpc('create_forum_thread_with_post',{p_category_id:cat.id,p_title:title,p_content:content});
   if(error){setMsg(error.message||'Unable to create the thread.','error');button.disabled=false;button.textContent='Post thread';return}
   const threadId=typeof data==='number'?data:Number(data);
   if(!threadId){setMsg('The thread was created but no thread ID was returned. Please refresh the forum.','error');button.disabled=false;button.textContent='Post thread';return}
   location.href='forum-thread.html?id='+threadId;
  });
 }catch(e){button.disabled=true;setMsg(e.message||'Unable to open the posting form.','error')}
});
</script></body></html>
